worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 75;
    gzip on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 7860;
        server_name _;

        client_max_body_size 200m;
        proxy_connect_timeout 20s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        send_timeout 3600s;

        location ^~ /user-server/ {
            proxy_pass http://127.0.0.1:83/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        location ^~ /monopoly-server/ {
            proxy_pass http://127.0.0.1:84/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        location ^~ /ice-server/ {
            proxy_pass http://127.0.0.1:85/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        location = /81 {
            return 301 /81/;
        }

        location ~* ^/81/.*\.html$ {
            root /var/www;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            try_files $uri $uri/ /81/index.html;
        }

        location ^~ /81/ {
            root /var/www;
            index index.html;
            try_files $uri $uri/ /81/index.html;
        }

        location = /82 {
            return 301 /82/;
        }

        location ~* ^/82/.*\.html$ {
            root /var/www;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            try_files $uri $uri/ /82/index.html;
        }

        location ^~ /82/ {
            root /var/www;
            index index.html;
            try_files $uri $uri/ /82/index.html;
        }

        location ~* ^/assets/.*\.(js|css|mjs|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
            root /var/www/monopoly-client;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location / {
            root /var/www/monopoly-client;
            index index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
